site_name: intelligen
site_url: https://Bouchet07.github.io/intelligen
repo_url: https://github.com/Bouchet07/intelligen
repo_name: Bouchet07/intelligen

# Add social links for the footer and a copyright notice
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bouchet07/intelligen
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/intelligen/ # Add a link to your PyPI page

copyright: Copyright &copy; 2025 Diego Bouchet

theme:
  name: material
  # Use the explicit light/dark mode palette for more control
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Enable more features for better navigation and usability
  features:
    - navigation.instant
    - navigation.tabs # Use top-level navigation as tabs
    - navigation.expand # Auto-expand navigation for the current page
    - navigation.top # Add a "back to top" button
    - content.code.copy # Add a copy button to code blocks
    - search.highlight

# The custom_dir is fine, but make sure it exists
# custom_dir: "docs/overrides"

plugins:
  - search
  - mkdocstrings
  - git-revision-date
  - mkdocs-jupyter:
      include_source: True

# Add more useful markdown extensions
markdown_extensions:
  - admonition # Better call-out boxes (note, warning, etc.)
  - pymdownx.details # Collapsible content blocks
  - pymdownx.superfences # Prerequisite for better code blocks
  - pymdownx.tabbed: # For creating tabbed content
      alternate_style: true
  - pymdownx.emoji: # To use emojis like :sparkles:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - pymdownx.highlight:
      linenums: true
  - toc:
      permalink: true

# Your navigation is good, using tabs will make the top-level items cleaner
nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - API Reference:
        - intelligen module: intelligen.md
    - Contributing: contributing.md
    - FAQ: faq.md
    - Report Issues: https://github.com/Bouchet07/intelligen/issues