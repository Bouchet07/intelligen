[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligen"
version = "0.13.1"
authors = [
    { name = "Diego Bouchet", email = "diegobouchet88@gmail.com" }
]
description = "This is a Python package for math and artificial intelligence tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["intelligen"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-git-revision-date-plugin>=0.3.0",
    "mkdocs-jupyter>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/Bouchet07/intelligen"
"Documentation" = "https://Bouchet07.github.io/intelligen"
"Repository" = "https://github.com/Bouchet07/intelligen"
"Bug Tracker" = "https://github.com/Bouchet07/intelligen/issues"

[tool.setuptools.packages.find]
include = ["intelligen", "intelligen.*"]

# --- Tool Configurations ---

[tool.ruff]
src = ["intelligen"]
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modernize code)
    "B",  # flake8-bugbear (finds likely bugs)
    "A",  # flake8-builtins (prevents shadowing builtins)
    "C4", # flake8-comprehensions (encourages efficient comprehensions)
    "SIM",# flake8-simplify (suggests code simplifications)
    "S",  # flake8-bandit (security checks)
    "D",  # pydocstyle (docstring conventions)
]

ignore = ["D100", "D102", "D103",
          "E701", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["intelligen"]

[tool.ruff.format]
quote-style = "double"
