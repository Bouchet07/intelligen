name: Build and Publish

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  release:
    types: [created]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only needed if you want to support ARM builds (optional)
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # Build for Python 3.10 - 3.13
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          
          # Skip 32-bit Windows (hard to build scipy/numpy ecosystem there)
          CIBW_SKIP: "*-win32 pp*" 
          
          # FIX: Use a newer Linux standard (glibc 2.28+)
          # This ensures pip can install modern wheels for NumPy/SciPy
          # instead of trying to compile them from source.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

          # Install test dependencies
          CIBW_TEST_REQUIRES: "pytest pytest-cov ruff"
          
          # CRITICAL FIX: --import-mode=importlib
          # This prevents pytest from picking up the local 'intelligen' folder 
          # (which is uncompiled) and forces it to use the installed wheel.
          CIBW_TEST_COMMAND: "pytest {project}/tests --import-mode=importlib"

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # NEW: Build the Source Distribution (.tar.gz)
  make_sdist:
    name: Make Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: pip-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist] # Wait for both wheels and sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
      # Download artifacts from all previous jobs
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: pip-sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.GHA_PYPI_API_TOKEN }}