name: Build and Publish Wheels

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [created]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM builds on Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.1
        env:
          # Tell cibuildwheel to build for Python 3.10, 3.11, 3.12, and 3.13
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # EDITED: Ensure a modern NumPy is installed before building the C++ extension.
          # This fixes the PyArray_FROM_OTF macro error on Linux.
          CIBW_BEFORE_BUILD: "pip install numpy"
          # EDITED: Skip 32-bit Windows builds. This avoids the difficult process
          # of building SciPy from source during the testing phase.
          CIBW_SKIP: "*-win32"
          # Install test dependencies from pyproject.toml's 'dev' extra
          CIBW_TEST_REQUIRES: ".[dev]"
          # Run tests using pytest, which is installed from the 'dev' extra
          CIBW_TEST_COMMAND: "pytest tests/"

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

      - name: Publish to PyPI
        # Only run this step when a new release is created on GitHub
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # This uses a token created via PyPI's Trusted Publishing feature.
          # You must configure this on PyPI for your project.
          password: ${{ secrets.GHA_PYPI_API_TOKEN }}