name: Build and Publish

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only needed if you want to support ARM builds on Linux
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Build only for Python 3.13 to keep testing fast initially
          CIBW_BUILD: "cp313-*"
          
          # Skip 32-bit Windows/Linux, PyPy, MuslLinux (Alpine), and free-threaded python
          CIBW_SKIP: "*-win32 *-i686 pp* *-musllinux* cp313t-*" 

          # Use modern Linux base image (SciPy 1.17+ dropped support for manylinux2014)
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

          # Use your dev dependencies from pyproject.toml (includes pytest)
          CIBW_TEST_EXTRAS: "dev"
          
          # Test the installed wheel, not the local uncompiled code
          CIBW_TEST_COMMAND: "pytest {project}/tests --import-mode=importlib"

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: pip-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    # Run publish if a release is created or workflow is manually triggered
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'created')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: pip-sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.GHA_PYPI_API_TOKEN }}